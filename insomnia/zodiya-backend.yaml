      name: Health
      meta:
          id: req_zodiya_health
          created: 1789216567000
          modified: 1789216567000
          isPrivate: false
          sortKey: -3
      method: GET
      settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
              send: true
              store: true
          rebuildPath: true
