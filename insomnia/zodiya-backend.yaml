            name: Register
            meta:
                id: req_zodiya_auth_register
                created: 1789216567000
                modified: 1789216567000
                isPrivate: false
                sortKey: -3
            method: POST
            body:
                mimeType: application/json
                text: |-
                    {
                        "firstName": "harshal",
                        "lastName": "chauhan",
                        "email": "{{ _.email }}",
                        "password": "{{ _.password }}"
                    }
            headers:
                - name: Content-Type
                  value: application/json
            settings:
                renderRequestBody: true
                encodeUrl: true
                followRedirects: global
                cookies:
                    send: true
                    store: true
                rebuildPath: true
